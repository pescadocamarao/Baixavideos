name: BaixaVideos
options:
  bundleIdPrefix: com.seidao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  BaixaVideos:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/BaixaVideos
    info:
      path: Sources/BaixaVideos/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seidao.baixavideos
        PRODUCT_NAME: BaixaVideos
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Manual
schemes:
  BaixaVideos:
    build:
      targets:
        BaixaVideos: all
    run:
      config: Debug
    archive:
      config: Release
